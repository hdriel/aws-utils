name: Publish to NPM

on:
    push:
        branches: ['main']

jobs:
    publish:
        if: "!contains(github.event.head_commit.message, 'no-build')" # skip if 'no-build' is present
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
          - name: Checkout
            uses: actions/checkout@v4

          - name: Install pnpm
            uses: pnpm/action-setup@v4
            with:
              version: 10

          - name: Setup Node
            uses: actions/setup-node@v4
            with:
              node-version: 20
              registry-url: https://registry.npmjs.org/
              scope: '@hdriel'
              cache: pnpm

          - name: Install dependencies
            # full install (build needs devDeps: tsup / typescript / @types/node);
            # --ignore-scripts skips native postinstall builds we don't need to bundle
            run: pnpm install --frozen-lockfile --ignore-scripts

          - name: Build package
            run: pnpm run build

          - name: Publish
            run: npm publish --access public
            env:
              NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
